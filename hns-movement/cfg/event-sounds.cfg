// hns-movement event sounds. Edit, then run hns_reload (server console or rcon).
// Lives at csgo/cfg/hns-movement/event-sounds.cfg. All of them play to everyone on the server.
// hns_event_sounds 0 in hns-movement.cfg turns them all off; "" turns one off.
//
// Sound event names come from the HNS workshop addon (soundevents/soundevents_hns.vsndevts). The addon's soundevents
// file must be precached: join-sounds.cfg already does that, so no precache line is needed here.
// Any stock CS2 sound event works too. Test from the server console: hns_event_sound_test <event | sound event>

// Seeker release countdown: plays as the CT start freeze reaches 3, 2 and 1 seconds left.
countdown_3   hns.countdown.3
countdown_2   hns.countdown.2
countdown_1   hns.countdown.1

// The death that leaves exactly one T alive (once per round).
last_man      hns.last_man_standing

// Two kills by the same player within double_kill_window seconds.
double_kill          hns.double_kill
double_kill_window   4

// Volume for all event sounds, 0-1.
volume  1.0
