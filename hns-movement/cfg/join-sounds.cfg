// hns-movement join sounds. Edit, then run hns_reload (server console or rcon).
// Lives at csgo/cfg/hns-movement/join-sounds.cfg. Settings (on/off, delay, cooldown) are in hns-movement.cfg.
//
// When a listed player joins, everyone on the server hears their sound (same EmitSound path as CS2KZ jumpstat sounds).
// It only plays after Steam has validated the player's ticket, so someone copying their name cannot trigger it.
//
// Custom sounds come from the HNS workshop addon (repo: hns-movement/addon), which every client downloads through
// MultiAddonManager (mm_extra_addons <workshop id>). Its soundevents file is precached on every map:
precache "soundevents/soundevents_hns.vsndevts"
//
// One line per player: <SteamID64 | STEAM_1:x:y | [U:1:n]> <sound event name> [volume 0-1, default 1]
// Any stock CS2 sound event works too, without an addon (e.g. UIPanorama.round_report_odds_up).
// Test from the server console: hns_join_sound_test <SteamID | sound event>
//
// 76561198000000000  hns.join.vip  1.0
