// hns-movement configuration. Edit, then run hns_reload (server console or rcon).
// Lives at csgo/cfg/hns-movement/hns-movement.cfg. If it is missing, the plugin writes this default.
//
// Movement cvars listed here are enforced every tick; changing them with the console or a map cfg has no lasting
// effect (the plugin overwrites them and prints a warning). Everything else (game_type, mp_*, bot_*,
// sv_falldamage_scale, mp_solid_enemies) stays in your server cfg.
//
// ---- Running with ChaseMod (CounterStrikeSharp) ----
// hns-movement is the movement unlocker and behaviour enforcer; ChaseMod keeps its gameplay features.
// Each feature is on in exactly one plugin. hns_status and every load / hns_reload warn about overlaps.
//   feature           owner          here                         ChaseMod.json
//   CT start freeze   hns-movement   hns_ct_freeze_time 15        "ctStartFreezeTime": 0
//   team switch       ChaseMod       hns_team_switch 0            "enableTeamSwitchingConditions": true
//                                    hns_t_winstreak_switch 0     "maxTerroristWinStreak": 5
//   knife damage      hns-movement   hns_knife_damage 55          "enableKnifeHook": false
//   knife cooldown    hns-movement   hns_knife_cooldown 2         (part of ChaseMod's knife hook, off)
//   T knife lockout   hns-movement   hns_knife_ct_only 1          "enableKnifeDisabling": false
//   freeze grenade    ChaseMod       -                            "stunFreezeTime" / "stunFreezeRadius"
//   team antiflash    ChaseMod       -                            -
// A recommended ChaseMod.json ships in the repo at cfg/chasemod/ChaseMod.json.

// ---- Plugin settings ----
hns_ps_enabled            1     // 1 = CS2KZ prestrafe + 250 ground clamp + KZ perf formula. 0 = sv_maxspeed on ground, perf keeps max(landing, takeoff) speed.
hns_perf_requires_jump    1     // 1 = perf speed rewrite only on real jumps (keeps surf speed when skimming/leaving ground). 0 = CS2KZ behaviour.
hns_ct_freeze_time        15    // Seconds CTs are frozen at round start; Ts can move and jump. 0 = off.
hns_freeze_no_falldamage  1     // 1 = sv_falldamage_scale is 0 while CTs are frozen, restored afterwards.
hns_freeze_effects        1     // 1 = frozen CTs are tinted blue and get the health-shot screen effect.
hns_no_guns               1     // 1 = nobody can hold a gun or taser; any that a player gets is removed.
hns_knife_ct_only         1     // 1 = everyone keeps a knife but only CTs can attack with it (Ts keep their grenades).
hns_knife_stab_only       1     // 1 = knife slash (attack1) is disabled, only the right-click stab works.
hns_knife_attack_is_stab  1     // 1 = for CTs holding the knife, left click (+attack) stabs like right click (+attack2).
hns_equip_knife           1     // 1 = switch to the knife when a player spawns or is left holding nothing.
hns_disable_autokick      1     // 1 = run mp_autokick 0 on every map start (no kicks for suiciding, team kills or team damage).
hns_disable_team_intro    1     // 1 = run mp_team_intro_time 0 (no frozen team intro after warmup).
hns_silent_team_change    1     // 1 = hide the "<player> is joining the Terrorists" chat line on team changes.
hns_speed_hud             1     // 1 = centre-screen HUD: "Speed: N u/s (takeoff)" and held keys W A S D C J (mouse wheel jumps included).
hns_ct_spawn_decoy        1     // 1 = CTs get a decoy when they spawn.
hns_t_spawn_grenades      1     // 1 = Ts get a smoke grenade and a flashbang when they spawn.
hns_knife_damage          55    // Damage of every CT knife hit on a T, backstabs included. 0 = game default.
hns_knife_cooldown        2     // Seconds a stabbed T takes no further knife damage (tinted red meanwhile). 0 = no cooldown.
hns_join_sound            1     // 1 = play a server-wide sound when a player listed in join-sounds.cfg joins.
hns_join_sound_delay      1     // Seconds after the listed player is in the server and Steam-validated before their join sound plays.
hns_join_sound_cooldown   1800  // Seconds before the same player's join sound can play again (stops replays on map change). 0 = every connection.
hns_js                    1     // 1 = CS2KZ jumpstats, shown only to the jumper and their spectators (tiers and sounds in jumpstats.cfg). !js / !jssound toggle.
hns_js_min_tier           2     // Lowest tier reported to the jumper: 0 off, 1 meh, 2 impressive, 3 perfect, 4 godlike, 5 ownage, 6 wrecker.
hns_js_sound_min_tier     2     // Lowest tier that plays a sound for the jumper (0 = never).
hns_js_volume             0.75  // Jumpstat sound volume, 0-1.
hns_js_console            1     // 1 = also print the detailed report and strafe table to console.
hns_understab             1     // 1 = deny CT stabs on a T standing (or last standing) more than hns_understab_height units above the CT's floor.
hns_understab_height      65    // Understab: height in units the T's ground may be above the CT's floor before a stab is denied.
hns_team_switch           0     // 1 = swap teams when the CTs win. Keep 0 when ChaseMod handles the team switch.
hns_t_winstreak_switch    0     // Also swap teams after this many T wins in a row. 0 = never. Keep 0 with ChaseMod.
hns_rampbug_threshold     0.999 // Rampbug fix: dot product below which two normals are different planes (CS2KZ: 0.999).
hns_rampbug_same_plane    0.99  // Rampbug fix: offset trace hitting a plane above this dot product counts as the same ramp (CS2KZ: 0.99).
hns_rampbug_min_distance  1     // Rampbug fix: offset trace must go this much further to be used (CS2KZ: 1.0).
hns_warn_external_change  1     // Warn in console when something else changes an enforced cvar.
hns_debug_perf            0     // Print every takeoff to the server console (development only).

// ---- Movement cvars ----
// Values from the existing HNS server cfg (CVARS.txt); cvars it did not set use the CS2KZ Classic value.
sv_accelerate                      6.5     // CS2KZ: 6.5
sv_accelerate_use_weapon_speed     false   // CS2KZ: false
sv_airaccelerate                   1000    // CS2KZ: 100
sv_air_max_wishspeed               35      // CS2KZ: 30 (HNS: +~17% air-strafe gain for faster surfing)
sv_autobunnyhopping                false   // CS2KZ: false
sv_bounce                          0       // CS2KZ: 0
sv_enablebunnyhopping              true    // CS2KZ: true
sv_friction                        4.05    // CS2KZ: 5.2
sv_gravity                         800     // CS2KZ: 800
sv_jump_impulse                    302     // CS2KZ: 302
sv_jump_precision_enable           false   // CS2KZ: false
sv_jump_spam_penalty_time          0       // CS2KZ: 0
sv_ladder_angle                    -0.707  // CS2KZ: -0.707
sv_ladder_dampen                   1       // CS2KZ: 1
sv_ladder_scale_speed              1       // CS2KZ: 1 (old HNS cfg had 2: twice KZ climb speed)
sv_maxspeed                        380     // CS2KZ: 320 (only applies on the ground when hns_ps_enabled is 0)
sv_maxvelocity                     3500    // CS2KZ: 3500
sv_staminajumpcost                 0       // CS2KZ: 0
sv_staminalandcost                 0       // CS2KZ: 0
sv_staminamax                      0       // CS2KZ: 0
sv_staminarecoveryrate             9999    // CS2KZ: 9999
sv_standable_normal                0.7     // CS2KZ: 0.7
sv_step_move_vel_min               64      // CS2KZ: 64
sv_timebetweenducks                0       // CS2KZ: 0
sv_walkable_normal                 0.7     // CS2KZ: 0.7
sv_wateraccelerate                 10      // CS2KZ: 10
sv_waterfriction                   1       // CS2KZ: 1
sv_water_slow_amount               0.9     // CS2KZ: 0.9
sv_subtick_movement_view_angles    false   // CS2KZ: false
sv_legacy_jump                     true    // CS2KZ: true
sv_bhop_time_window                0.05    // CS2KZ: 0.02 (inert while sv_legacy_jump is true)
hns_solid_teammates                0       // CS2KZ: 0 (sets mp_solid_teammates: 0 = pass through, 1 = solid, 2 = solid, no head-standing)
hns_engine_freezetime              0       // sets mp_freezetime. Keep 0: the engine freezetime freezes Ts too; hns_ct_freeze_time freezes only CTs.
