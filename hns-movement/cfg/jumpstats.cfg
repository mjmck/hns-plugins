// hns-movement jumpstats. Edit, then run hns_reload (server console or rcon).
// Lives at csgo/cfg/hns-movement/jumpstats.cfg. On/off, report thresholds and volume are in hns-movement.cfg (hns_js_*).
//
// Distance tiers: <jump type> <meh> <impressive> <perfect> <godlike> <ownage> <wrecker>
// A jump gets the highest tier whose distance it reaches. Defaults are CS2KZ Classic (sv_airaccelerate 100,
// sv_air_max_wishspeed 30). This server's movement settings make jumps longer: raise these after playtesting.
LJ   217 265 270 275 280 284
BH   217 275 280 287 292 295
MBH  217 275 280 287 292 295
WJ   217 275 280 287 292 295
LAJ  120 160 170 180 190 200
LAH  217 260 265 270 275 278
JB   217 275 280 287 292 295

// No tier (and no report) above this distance.
max_distance 500

// Tier sounds: sound <tier> <sound event>. "" = silent. Defaults are CS2KZ's, from workshop addon 3469155349
// (MultiAddonManager: mm_extra_addons). Without the addon mounted they are silent.
sound impressive kz.impressive
sound perfect    kz.perfect
sound godlike    kz.godlike
sound ownage     kz.ownage
sound wrecker    kz.wrecker

// Soundevents files added to every map's precache manifest (same as CS2KZ does for its addon).
precache "soundevents/soundevents_cs2kz.vsndevts"
